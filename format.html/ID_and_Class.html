<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID and Classes in HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ID uniquely identifies an element and class can be used to style multiple elements -->
     <!-- #->means class and dot(.) means ID-->

    <div id="firstdiv" class="red bg-green">This is the first div</div>
    <div id="seconddiv" class="blue">This is the second div</div>
    <span class="third">This is a purple span</span>



    
</body>
</html>
