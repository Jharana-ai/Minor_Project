<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1>form to apply for the cafe</h1>
    <form action="POST">
        <div>
            <label for="username">Enter your username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">Subscribe to our branding updates</label>
        </div>
        <div>
            <br>
            <label for=""comment">Enter your comment everyone</label>
            <br>
            <textarea name="comment" row="10" cols="60">
                
            </textarea>

        </div>
        <div>
            <select name="Items">
                <option value="MOMO">MOMO</option>
                <option value="VEG CHOWMIN">VEG CHOWMIN</option>
                <option value="CHICKEN CHOWMIN">CHICKEN CHOWMIN</option>
                <option value="SAMOSA">SAMOSA</option>
            </select>

        </div>

    </form>


</body>

</html>
